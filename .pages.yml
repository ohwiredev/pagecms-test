media:
  input: public
  output: /

content:
  - name: blogs
    label: Blogs
    filename: "{primary}.md"
    path: src/content/blog
    type: collection
    fields:
      - name: title
        type: string
        
      - name: description
        type: text
        options:
          maxlength: 280
          
      - name: pubDate
        type: date

      - name: body
        label: Body
        type: rich-text
        options:
          media: content_images
          path: public/images/blog
          rename: true
          switcher: true